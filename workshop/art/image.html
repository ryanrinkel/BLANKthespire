<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../web/static/style.css">
<style>
  html,body{width:1280px;height:720px;margin:0;overflow:hidden}
  body.landing{background:radial-gradient(120% 90% at 50% -10%, #221c34 0%, var(--bg) 60%)}
  .splash{min-height:720px;padding:0;justify-content:center}
  .tile{width:150px;flex:0 0 150px}
  .flap{font-size:120px}
  .board{gap:18px}
  .splash-sub{margin-top:30px;font-size:30px;letter-spacing:8px}
  .splash-tag{margin-top:26px;font-size:18px}
</style></head>
<body class="landing"><main class="splash">
<div class="board" role="img">
<div class="tile"><span class="flap">B</span></div>
<div class="tile"><span class="flap">L</span></div>
<div class="tile"><span class="flap">A</span></div>
<div class="tile"><span class="flap">N</span></div>
<div class="tile"><span class="flap">K</span></div>
</div>
<p class="splash-sub">the spire</p>
<p class="splash-tag muted">How will you fill in the Blank?</p>
</main></body></html>
