<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../web/static/style.css">
<style>
  html,body{width:420px;height:420px;margin:0;overflow:hidden}
  body.landing{background:radial-gradient(120% 90% at 50% -10%, #221c34 0%, var(--bg) 60%)}
  .wrap{width:420px;height:420px;display:grid;place-items:center}
  .tile{width:270px;flex:0 0 270px;border-radius:18px;border-bottom-width:6px}
  .tile::after{height:3px}
  .flap{font-size:220px}
</style></head>
<body class="landing"><div class="wrap"><div class="tile"><span class="flap">B</span></div></div></body></html>
