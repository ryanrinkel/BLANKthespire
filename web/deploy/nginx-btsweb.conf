# nginx site for the Forge-a-Class app. Install to /etc/nginx/sites-available/btsweb, symlink into
# sites-enabled, `nginx -t`, then reload. Run certbot afterward to add TLS (it rewrites this for :443).
#
# The critical bit for this app: proxy_buffering off on the app location, so the multi-minute SSE forge
# streams progress to the browser live instead of nginx holding it until the response finishes.

server {
    listen 80;
    server_name YOURDOMAIN.com;

    # Generated class art. The MOD fetches splash/sprite/relic/cards.zip from here when a player imports
    # a code, and that fetch is the only server-side trace a forged code was ever used — so this one
    # prefix IS logged (tools/traffic_report.py turns it into the "Imported" column of the user panel).
    location /static/forged/ {
        alias /opt/btsweb/web/static/forged/;
        expires 1h;
        access_log /var/log/nginx/access.log;
    }

    # Everything else under /static/ (css, js, images) stays quiet.
    location /static/ {
        alias /opt/btsweb/web/static/;
        expires 1h;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # --- SSE / long forge streaming ---
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        chunked_transfer_encoding on;
    }
}
